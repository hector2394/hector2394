<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Applied AI engineering</title>
  <desc id="desc">Built end to end. Agents, retrieval and evaluation. An abstract connected system in indigo and mint.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101322"/>
      <stop offset="1" stop-color="#121a29"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#7875ec" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7875ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x2="1" y2=".3">
      <stop stop-color="#bbb7ff"/>
      <stop offset="1" stop-color="#93e8d4"/>
    </linearGradient>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#2b304c"/>
      <stop offset="1" stop-color="#1b2235"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a4acc9" fill-opacity=".12"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="388" rx="24" fill="url(#background)" stroke="#30374b"/>
  <rect x="710" y="20" width="456" height="350" fill="url(#grid)"/>
  <ellipse cx="947" cy="190" rx="250" ry="184" fill="url(#aura)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="46" width="6" height="6" rx="2" fill="#93e8d4"/>
    <text x="66" y="54" fill="#b1b9d0" font-size="12" letter-spacing="3">APPLIED AI ENGINEERING</text>
    <text x="46" y="151" fill="#f0f3ff" font-size="76" font-weight="700" letter-spacing="-3">Applied AI.</text>
    <text x="48" y="222" fill="url(#accent)" font-size="58" font-weight="600" letter-spacing="-2">Built end to end.</text>
    <text x="50" y="276" fill="#b1b9d0" font-size="21">Agents · Retrieval · Evaluation</text>
    <path d="M50 318 H645" stroke="#30374b"/>
    <text x="50" y="347" fill="#a2acc5" font-size="12" letter-spacing="1.7">PYTHON / TYPESCRIPT / POSTGRESQL / GOOGLE CLOUD</text>
  </g>
  <g fill="none" stroke-width="1.2">
    <ellipse cx="948" cy="192" rx="164" ry="129" stroke="#5d638c" stroke-opacity=".5" transform="rotate(-26 948 192)"/>
    <ellipse cx="948" cy="192" rx="113" ry="166" stroke="#66719b" stroke-opacity=".35" transform="rotate(-37 948 192)"/>
    <path d="M803 115 L952 183 L1080 117 M952 183 L1059 291 M952 183 L818 283" stroke="#8e93cc" stroke-opacity=".6"/>
    <path d="M803 115 L818 283 L1059 291 L1080 117 Z" stroke="#66719b" stroke-opacity=".24"/>
  </g>
  <g font-family="Consolas, monospace" font-size="12">
    <rect x="753" y="89" width="108" height="50" rx="12" fill="#1b2235" stroke="#51587d"/>
    <circle cx="774" cy="114" r="3" fill="#b9b4ff"/>
    <text x="788" y="118" fill="#c9c8ed">retrieve</text>
    <rect x="1018" y="92" width="111" height="50" rx="12" fill="#1b2235" stroke="#466d72"/>
    <circle cx="1039" cy="117" r="3" fill="#93e8d4"/>
    <text x="1053" y="121" fill="#b4dfd7">reason</text>
    <rect x="1006" y="266" width="116" height="50" rx="12" fill="#1b2235" stroke="#51587d"/>
    <circle cx="1027" cy="291" r="3" fill="#b9b4ff"/>
    <text x="1041" y="295" fill="#c9c8ed">evaluate</text>
    <rect x="766" y="258" width="107" height="50" rx="12" fill="#1b2235" stroke="#466d72"/>
    <circle cx="787" cy="283" r="3" fill="#93e8d4"/>
    <text x="801" y="287" fill="#b4dfd7">iterate</text>
  </g>
  <rect x="904" y="135" width="96" height="96" rx="26" fill="url(#panel)" stroke="#9698dc" stroke-opacity=".65" transform="rotate(-12 952 183)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
